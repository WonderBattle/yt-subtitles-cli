[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-subtitles-cli"
version = "1.0.0"
description = "Download auto-generated captions from YouTube videos"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.6"
dependencies = [
    "yt-dlp>=2024.1.0"
]
keywords = ["youtube", "subtitles", "captions", "download"]

[project.urls]
Homepage = "https://github.com/yourusername/yt-subtitles-cli"
Repository = "https://github.com/yourusername/yt-subtitles-cli"

[project.scripts]
yt-subtitles = "download_captions:main"

[tool.setuptools]
py-modules = ["download_captions"]
